<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner password reset · Mishnex</title><style>body{font:16px system-ui;background:#0b1220;color:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(400px,calc(100% - 48px));padding:32px;background:#182337;border-radius:16px}label,input,button{display:block;width:100%;box-sizing:border-box;margin-top:12px}input{padding:13px;border:1px solid #60708c;border-radius:8px;background:#0b1220;color:white}button{padding:13px;border:0;border-radius:8px;background:#56c6e8;color:#071525;font-weight:700;cursor:pointer}button:disabled{opacity:.6}a{color:#8bdcff}p{line-height:1.5}</style></head><body><main class="card"><h1>Reset Owner Password</h1><p id="status" role="status">Checking recovery link…</p><form id="form" hidden><label>New password<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button id="save">Set new password</button></form><p><a href="https://github.com/Mishnex/mishnex-technologies/blob/development/admin-crm-foundation/admin-preview.html">Admin preview source</a></p></main><script>
(async()=>{const status=document.getElementById('status'),form=document.getElementById('form');const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);const config=await fetch('/api/public/auth-config',{cache:'no-store'}).then(r=>r.json());if(!config.url||!config.key){status.textContent='Password recovery is temporarily unavailable.';return;}let token=hash.get('access_token');const endpoint=config.url+'/auth/v1';try{if(!token&&query.get('token_hash')&&query.get('type')==='recovery'){const r=await fetch(endpoint+'/verify',{method:'POST',headers:{apikey:config.key,'Content-Type':'application/json'},body:JSON.stringify({token_hash:query.get('token_hash'),type:'recovery'})});if(!r.ok)throw Error('Recovery link expired or invalid. Request a fresh email.');const data=await r.json();token=data.access_token;}if(hash.get('type')&&hash.get('type')!=='recovery')throw Error('This is not a password recovery link.');if(!token)throw Error('Recovery token missing. Request a fresh password reset email.');history.replaceState(null,'',location.pathname);status.textContent='Enter a new password (at least 12 characters).';form.hidden=false;form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='Passwords do not match.';return;}const save=document.getElementById('save');save.disabled=true;try{const r=await fetch(endpoint+'/user',{method:'PUT',headers:{apikey:config.key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw Error('Password update failed. The recovery link may have expired.');token=null;form.reset();form.hidden=true;status.textContent='Password updated. You can now sign in to the Owner Admin Panel.';}catch(err){status.textContent=err.message;}finally{save.disabled=false;}});}catch(err){status.textContent=err.message;}})();
</script></body></html>
