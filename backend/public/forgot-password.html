<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Password Recovery · Mishnex</title><style>body{font:16px system-ui;background:#0b1220;color:#f1f5f9;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(400px,calc(100% - 48px));padding:32px;background:#182337;border-radius:16px}label,input,button{display:block;width:100%;box-sizing:border-box;margin-top:12px}input{padding:13px;border:1px solid #60708c;border-radius:8px;background:#0b1220;color:white}button{padding:13px;border:0;border-radius:8px;background:#56c6e8;color:#071525;font-weight:700;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.5}</style></head><body><main class="card"><h1>Owner Password Recovery</h1><p>Enter your registered Owner email. A secure reset link will be sent if email delivery is available.</p><form id="recovery"><label>Email<input id="email" type="email" autocomplete="email" required maxlength="254"></label><button id="send" type="submit">Send reset email</button></form><p id="status" role="status" aria-live="polite"></p></main><script>document.getElementById('recovery').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('send'),status=document.getElementById('status');btn.disabled=true;status.textContent='Requesting email…';try{const response=await fetch('/api/admin/password-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const data=await response.json();status.textContent=response.ok?data.message:(data.error||'Could not request recovery. Please try later.');}catch{status.textContent='Connection failed. Try again later.';}finally{btn.disabled=false;}});</script></body></html>
