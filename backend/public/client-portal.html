<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mishnex Client Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1425;color:#f1f6ff;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:16px}.panel{background:#19263d;border:1px solid #394962;border-radius:16px;padding:24px;margin:16px 0}input,button,select{padding:12px;font:inherit;border-radius:8px}input{width:100%;margin:6px 0 14px;background:#0b1528;color:white;border:1px solid #8494ab}button{background:#60d5ec;color:#10192a;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.6}table{border-collapse:collapse;width:100%;overflow-wrap:anywhere}th,td{padding:12px;text-align:left;border-bottom:1px solid #46556b}p{line-height:1.5}#message{min-height:1.5em;color:#d5e8f7}[hidden]{display:none!important}@media(max-width:600px){table{font-size:13px}th,td{padding:7px}}</style></head><body><main><h1>Mishnex Client Portal</h1><p>Securely view projects and issued invoices linked to your account.</p><section class="panel" id="loginPanel"><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><section id="dashboard" hidden><button id="logout">Sign out</button><div class="panel"><h2>Your accounts</h2><div id="accounts"></div></div><div class="panel"><h2>Projects</h2><div id="projects"></div></div><div class="panel"><h2>Invoices</h2><div id="invoices"></div></div></section><p id="message" role="status" aria-live="polite"></p></main><script>
let token=null;const $=id=>document.getElementById(id);let authConfig=null;
async function request(url,options={}){const response=await fetch(url,{...options,headers:{...(options.headers||{}),...(token?{Authorization:'Bearer '+token}:{})},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||data.msg||'Request failed');return data}
function table(target,rows,columns){const root=$(target);root.replaceChildren();if(!rows.length){root.textContent='No records available.';return}const t=document.createElement('table'),head=t.createTHead().insertRow();columns.forEach(([key,label])=>{const th=document.createElement('th');th.textContent=label;head.append(th)});const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();columns.forEach(([key])=>{const td=tr.insertCell();td.textContent=row[key]??'—'})});root.append(t)}
async function load(){const data=await request('/api/client/overview');const accounts=$('accounts');accounts.replaceChildren();if(!data.clients.length){accounts.textContent='No client account linked yet. Please contact Mishnex support.';table('projects',[],[]);table('invoices',[],[]);return}for(const client of data.clients){const b=document.createElement('button');b.textContent=client.name;b.style.margin='5px';b.onclick=()=>selectClient(client.id);accounts.append(b)}await selectClient(data.clients[0].id)}
async function selectClient(id){const [p,i]=await Promise.all([request('/api/client/clients/'+encodeURIComponent(id)+'/projects'),request('/api/client/clients/'+encodeURIComponent(id)+'/invoices')]);table('projects',p.projects,[['name','Project'],['status','Status'],['due_date','Due date']]);table('invoices',i.invoices,[['id','Invoice ID'],['amount','Amount'],['paid_amount','Paid'],['currency','Currency'],['status','Status'],['due_date','Due date']])}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;$('message').textContent='Signing in…';try{authConfig=authConfig||await request('/api/public/auth-config');if(!authConfig.url||!authConfig.key)throw Error('Client sign in is not configured');const response=await fetch(authConfig.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:authConfig.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const data=await response.json();if(!response.ok||!data.access_token)throw Error('Invalid email or password');token=data.access_token;$('password').value='';await load();$('loginPanel').hidden=true;$('dashboard').hidden=false;$('message').textContent='Signed in successfully.'}catch(err){token=null;$('message').textContent=err.message}finally{b.disabled=false}};
$('logout').onclick=()=>{token=null;$('dashboard').hidden=true;$('loginPanel').hidden=false;$('accounts').replaceChildren();$('projects').replaceChildren();$('invoices').replaceChildren();$('message').textContent='Signed out.'};
</script></body></html>
