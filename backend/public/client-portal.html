<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mishnex Client Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1425;color:#f1f6ff;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:16px}.panel{background:#19263d;border:1px solid #394962;border-radius:16px;padding:24px;margin:16px 0}input,button,select{padding:12px;font:inherit;border-radius:8px}input{width:100%;margin:6px 0 14px;background:#0b1528;color:white;border:1px solid #8494ab}button{background:#60d5ec;color:#10192a;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.6}table{border-collapse:collapse;width:100%;overflow-wrap:anywhere}th,td{padding:12px;text-align:left;border-bottom:1px solid #46556b}p{line-height:1.5}#message{min-height:1.5em;color:#d5e8f7}[hidden]{display:none!important}@media(max-width:600px){table{font-size:13px}th,td{padding:7px}}</style></head><body><main><h1>Mishnex Client Portal</h1><p>Securely view projects and issued invoices linked to your account.</p><section class="panel" id="loginPanel"><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><section id="dashboard" hidden><button id="logout">Sign out</button><div class="panel"><h2>Your accounts</h2><div id="accounts"></div></div><div class="panel"><h2>Projects</h2><div id="projects"></div></div><div class="panel"><h2>Your quotations</h2><div id="quotations"></div></div><div class="panel"><h2>Invoices</h2><div id="invoices"></div></div><div class="panel"><h2>Submit UPI payment</h2><p id="upiDetails"></p><p>Submit the transaction reference after paying. Verification is manual.</p><form id="paymentForm"><label for="invoiceId">Invoice</label><select id="invoiceId" required></select><label for="paymentAmount">Amount paid</label><input id="paymentAmount" type="number" min="0.01" step="0.01" required><label for="paymentReference">UPI transaction reference</label><input id="paymentReference" minlength="3" maxlength="120" required><button>Submit for verification</button></form></div><div class="panel"><h2>Payment status & history</h2><button id="refresh">Refresh status</button><div id="payments"></div><div id="receipt"></div></div></section><p id="message" role="status" aria-live="polite"></p></main><script>
let token=null,epoch=0,selection=0,clientId=null;const $=id=>document.getElementById(id);
async function request(url,options={}){const expected=epoch;const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})},cache:'no-store'});const data=await response.json().catch(()=>({}));if(expected!==epoch)throw Error('Session changed.');if(!response.ok)throw Error(data.error||data.msg||'Request failed');return data}
function table(target,rows,columns){const root=$(target);root.replaceChildren();if(!rows.length){root.textContent='No records available.';return}const t=document.createElement('table'),head=t.createTHead().insertRow();columns.forEach(([key,label])=>{const th=document.createElement('th');th.textContent=label;head.append(th)});const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();columns.forEach(([key])=>{const td=tr.insertCell();td.textContent=row[key]??'—'})});root.append(t)}
async function load(){const policy=await request('/api/client/payment-config');$('upiDetails').textContent=policy.policy.upi_id?'Receiving UPI ID: '+policy.policy.upi_id+' · Advance: '+policy.policy.advance_percent+'%':'Payment instructions will be provided by Mishnex. Contact the team before paying.';const data=await request('/api/client/overview');const accounts=$('accounts');accounts.replaceChildren();if(!data.clients.length){accounts.textContent='No client account linked yet. Please contact Mishnex support.';return}for(const client of data.clients){const b=document.createElement('button');b.textContent=client.name;b.style.margin='5px';b.onclick=()=>selectClient(client.id).catch(err=>{$('message').textContent=err.message});accounts.append(b)}await selectClient(data.clients[0].id)}
async function selectClient(id){clientId=id;const seq=++selection,expected=epoch;$('receipt').replaceChildren();const base='/api/client/clients/'+encodeURIComponent(id);const [p,i,payments,q]=await Promise.all([request(base+'/projects'),request(base+'/invoices'),request(base+'/payments').catch(err=>({payments:[],error:err.message})),request(base+'/quotations')]);if(seq!==selection||epoch!==expected)return;
 table('quotations',q.quotations,[['title','Quotation'],['amount','Total amount'],['currency','Currency'],['advance_percent','Advance %'],['advance_amount','Advance amount'],['status','Status']]);table('projects',p.projects,[['name','Project'],['status','Status'],['due_date','Due date']]);table('invoices',i.invoices,[['id','Invoice ID'],['amount','Total'],['paid_amount','Paid'],['currency','Currency'],['status','Status']]);
 $('invoiceId').replaceChildren();for(const invoice of i.invoices.filter(x=>['issued','part_paid'].includes(x.status))){const option=document.createElement('option');option.value=invoice.id;option.textContent='#'+invoice.id+' — '+invoice.currency+' '+(Number(invoice.amount)-Number(invoice.paid_amount)).toFixed(2)+' remaining';$('invoiceId').append(option)}
 table('payments',payments.payments,[['id','Payment'],['invoice_id','Invoice'],['amount','Submitted'],['status','Status'],['total_amount','Total'],['paid_amount','Paid'],['remaining_amount','Balance'],['reason','Review reason']]);
 if(payments.error){$('payments').textContent=payments.error;return}
 for(const payment of payments.payments.filter(x=>x.status==='approved')){const b=document.createElement('button');b.textContent='Receipt for payment #'+payment.id;b.onclick=async()=>{try{const active=selection;const data=await request('/api/client/payments/'+payment.id+'/receipt');if(active!==selection)return;table('receipt',[data.receipt],[['receipt_number','Receipt'],['client_name','Client'],['invoice_id','Invoice'],['currency','Currency'],['amount','Paid'],['reference','Reference'],['recorded_at','Verified at'],['total_amount','Total'],['remaining_amount','Balance']])}catch(err){$('message').textContent=err.message}};$('payments').append(b)}
}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),attempt=++epoch;b.disabled=true;$('message').textContent='Signing in…';try{const data=await request('/api/client/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(attempt!==epoch)return;token=data.accessToken;$('password').value='';await load();if(attempt!==epoch)return;$('loginPanel').hidden=true;$('dashboard').hidden=false;$('message').textContent='Signed in successfully.'}catch(err){if(attempt===epoch){token=null;$('message').textContent=err.message}}finally{b.disabled=false}};
$('paymentForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),expected=epoch;b.disabled=true;try{const data=await request('/api/client/invoices/'+encodeURIComponent($('invoiceId').value)+'/payments',{method:'POST',body:JSON.stringify({amount:Number($('paymentAmount').value),reference:$('paymentReference').value.trim()})});if(epoch!==expected)return;$('paymentForm').reset();await selectClient(clientId);$('message').textContent=data.message}catch(err){if(epoch===expected)$('message').textContent=err.message}finally{b.disabled=false}};
$('refresh').onclick=()=>clientId&&selectClient(clientId).catch(err=>{$('message').textContent=err.message});
$('logout').onclick=()=>{epoch++;selection++;token=null;clientId=null;$('dashboard').hidden=true;$('loginPanel').hidden=false;for(const id of ['accounts','projects','invoices','payments','receipt','invoiceId','quotations','upiDetails'])$(id).replaceChildren();$('paymentForm').reset();$('message').textContent='Signed out.'};
</script></body></html>
