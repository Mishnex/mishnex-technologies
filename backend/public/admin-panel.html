<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mishnex | Admin Workspace</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#14253b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#0e2139;color:#d5e1f4;padding:28px 18px}.brand{font-size:22px;font-weight:800;color:white;letter-spacing:-.6px;margin:0 8px 35px}.brand span{color:#45c6c0}.nav{width:100%;display:block;background:none;color:inherit;border:0;text-align:left;padding:13px 16px;border-radius:10px;margin:5px 0}.nav.active,.nav:hover{background:#213c5b;color:#fff}.main{padding:32px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.muted{color:#62718a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.panel{background:white;border:1px solid #e1e8f2;border-radius:16px;padding:24px;box-shadow:0 5px 18px #132f5410}.number{font-size:34px;font-weight:800;margin-top:12px}.panel{margin-top:20px;overflow-x:auto}.panel h2{margin:0 0 16px;font-size:19px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e8edf5;vertical-align:middle}th{color:#65738a;font-size:12px;text-transform:uppercase;letter-spacing:.05em}td{max-width:270px;overflow-wrap:anywhere}.btn{background:#1269db;border:0;color:#fff;border-radius:9px;padding:10px 15px;font-weight:650}.btn.alt{background:#edf3fc;color:#1c426f}.btn.danger{background:#fff0f0;color:#a32b2b}.actions{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{border:1px solid #cbd7e8;border-radius:9px;padding:11px;width:100%;background:#fff}label{font-size:13px;font-weight:650;display:block;margin:12px 0 5px}.form{max-width:440px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(125deg,#0c2442,#1766ad)}.login .card{width:min(440px,100%)}.notice{padding:13px;border-radius:9px;background:#e9f2ff;color:#164a83;margin:15px 0}.error{background:#fff0f0;color:#a22525}.pill{background:#edf3fc;color:#24528a;border-radius:30px;padding:5px 9px;white-space:nowrap}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar input{max-width:270px}.empty{padding:24px;text-align:center;color:#697991}.logout{margin-top:35px}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{padding:14px}.brand{margin:5px 0 12px}.nav{display:inline-block;width:auto;padding:9px}.main{padding:18px}.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}table{min-width:700px}}
</style></head><body>
<section id="login" class="login"><div class="card"><h1>Mishnex <span style="color:#1269db">Admin</span></h1><p class="muted">Secure workspace sign in</p><label for="loginMode">Account type</label><select id="loginMode"><option value="owner">Owner</option><option value="employee">Employee</option></select><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:20px">Sign in</button></form><p id="loginError" role="alert"></p><p class="muted">Authorized accounts only. Employee accounts must change their temporary password before accessing permitted modules.</p></div></section>
<section id="app" class="shell hidden"><aside class="sidebar"><div class="brand">Mishnex<span>.</span></div><button class="nav active" data-page="dashboard">◫ Dashboard</button><button class="nav" data-page="leads">▤ Leads</button><button class="nav" data-page="clients">▣ Clients</button><button class="nav" data-page="staff">♙ Team & access</button><button class="nav" data-page="hr">♧ HR Management</button><button class="nav" data-page="projects">▤ Projects</button><button class="nav" data-page="tasks">☷ Tasks</button><button class="nav" data-page="quotations">▧ Quotations</button><button class="nav" data-page="invoices">▣ Invoices</button><button class="nav" data-page="website">◈ Website CMS</button><button class="nav" data-page="reports">▥ Reports</button><button class="nav logout" id="logout">↪ Sign out</button></aside><main class="main"><div class="top"><div><h1 id="heading" style="margin:0">Dashboard</h1><p class="muted" id="subtitle">Mishnex Technologies management workspace</p></div><span id="identity" class="pill"></span></div><div id="message" role="status" aria-live="polite"></div><div id="content"></div></main></section>
<script>
(()=>{'use strict';
let token=null,view='dashboard',leads=[],clients=[],staff=[],me=null,accountType='owner';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function alertBox(message,error=false){$('message').innerHTML=message?'<div class="notice '+(error?'error':'')+'">'+esc(message)+'</div>':''}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers},cache:'no-store'});const body=await response.json().catch(()=>({}));if(!response.ok){const err=new Error(body.error||'Request failed ('+response.status+')');err.status=response.status;throw err}return body}
function signOut(){token=null;me=null;accountType='owner';leads=[];clients=[];staff=[];$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';$('loginError').textContent='';alertBox('')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('loginError').textContent='';try{accountType=$('loginMode').value;const base=accountType==='employee'?'/api/admin/staff':'/api/admin';const result=await api(base+'/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=result.accessToken;try{me=await api(base+'/me')}catch(error){token=null;throw new Error('Password accepted but account verification failed: '+error.message)}$('identity').textContent=accountType==='employee'?(me.fullName+' · '+me.role):(me.email||'Owner');$('login').classList.add('hidden');$('app').classList.remove('hidden');document.querySelector('[data-page="dashboard"]').classList.toggle('hidden',accountType==='employee');document.querySelector('[data-page="staff"]').classList.toggle('hidden',accountType==='employee');document.querySelector('[data-page="hr"]').classList.toggle('hidden',accountType==='employee'&&!me.permissions?.includes('hr:employees:read'));document.querySelectorAll('[data-page="projects"],[data-page="tasks"],[data-page="quotations"],[data-page="invoices"],[data-page="website"],[data-page="reports"]').forEach(b=>b.classList.toggle('hidden',accountType==='employee'));document.querySelector('[data-page="clients"]').classList.toggle('hidden',accountType==='employee');document.querySelector('[data-page="leads"]').classList.toggle('hidden',accountType==='employee'&&!me.permissions?.includes('leads:read'));await navigate(accountType==='employee'?'employee':'dashboard');if($('app').classList.contains('hidden'))throw new Error('Your account could not open the workspace. Check account type and permissions.')}catch(err){token=null;me=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginError').textContent='Login could not finish: '+(err?.message||'Unexpected error. Please retry.');$('loginError').scrollIntoView({block:'nearest'})}finally{button.disabled=false}});
$('logout').addEventListener('click',async()=>{if(accountType==='employee'&&token){try{await api('/api/admin/staff/logout',{method:'POST',body:'{}'})}catch(err){console.warn('Server logout could not be confirmed:',err.message)}}signOut()});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
async function fetchAll(){const results=await Promise.allSettled([api('/api/admin/leads'),api('/api/admin/clients'),api('/api/admin/staff/')]);leads=results[0].status==='fulfilled'?results[0].value.leads:[];clients=results[1].status==='fulfilled'?results[1].value.clients:[];staff=results[2].status==='fulfilled'?results[2].value.staff:[];return results.map(r=>r.status==='rejected'?r.reason.message:null)}
async function navigate(page){if(accountType==='employee'&&!['employee','leads','hr'].includes(page))return;if(accountType==='employee'&&page==='leads'&&!me?.permissions?.includes('leads:read'))return;if(accountType==='employee'&&page==='hr'&&!me?.permissions?.includes('hr:employees:read'))return;view=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('heading').textContent=({dashboard:'Dashboard',leads:'Lead management',clients:'Client directory',staff:'Team & access',employee:'Employee workspace',hr:'HR Management',projects:'Projects',tasks:'Tasks',quotations:'Quotations',invoices:'Invoices',website:'Website CMS',reports:'Reports'})[page];alertBox('');$('content').innerHTML='<div class="panel">Loading...</div>';try{if(page==='reports'){await renderReports();return}if(['projects','tasks','quotations','invoices','website'].includes(page)){await renderErp(page);return}if(page==='hr'){await renderHr();return}if(page==='employee'){renderEmployee();return}if(page==='leads'&&accountType==='employee'){leads=(await api('/api/admin/staff/leads')).leads;renderEmployeeLeads();return}if(page==='dashboard'){const errors=await fetchAll();renderDashboard(errors)}if(page==='leads'){leads=(await api('/api/admin/leads')).leads;renderLeads()}if(page==='clients'){clients=(await api('/api/admin/clients')).clients;renderClients()}if(page==='staff'){staff=(await api('/api/admin/staff/')).staff;renderStaff()}}catch(err){if(err.status===401||err.status===403){signOut();$('loginError').textContent='Your session expired or access was denied. Please sign in again.'}else{$('content').innerHTML='<div class="panel"><h2>Module unavailable</h2><p>'+esc(err.message)+'</p><button class="btn alt" id="retry">Retry</button></div>';$('retry').onclick=()=>navigate(page)}}}
async function renderReports(){const data=await api('/api/admin/erp/reports/overview'),r=data.report;const entries=[['Total leads',r.leads],['Clients',r.clients],['Projects',r.projects],['Tasks',r.tasks],['Completed tasks',r.completed_tasks],['Active staff',r.active_staff],['Pending leaves',r.pending_leaves],['Open invoices',r.open_invoices]];$('content').innerHTML='<div class="grid">'+entries.map(([name,value])=>'<div class="card"><div class="muted">'+esc(name)+'</div><div class="number">'+esc(value)+'</div></div>').join('')+'</div><div class="panel"><h2>Invoice totals by currency</h2>'+(data.financial.length?'<table><thead><tr><th>Currency</th><th>Invoiced</th><th>Received</th><th>Outstanding</th></tr></thead><tbody>'+data.financial.map(x=>'<tr><td>'+esc(x.currency)+'</td><td>'+esc(x.invoiced)+'</td><td>'+esc(x.received)+'</td><td>'+esc(x.outstanding)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No invoices yet.</div>')+'</div>'}
async function renderErp(resource){
 const fields={
 projects:[['name','Project name','text',true],['clientId','Client UUID','text'],['description','Description','text'],['status','Status','select:planned,active,on_hold,completed,cancelled'],['dueDate','Due date','date']],
 tasks:[['projectId','Project ID','number',true],['title','Task title','text',true],['assignee','Assignee UUID','text'],['status','Status','select:todo,in_progress,blocked,done'],['dueDate','Due date','date']],
 quotations:[['clientId','Client UUID','text'],['title','Quotation title','text',true],['amount','Amount','number',true],['currency','Currency','select:INR,USD,EUR,GBP'],['status','Status','select:draft,sent,accepted,rejected']],
 invoices:[['clientId','Client UUID','text',true],['quotationId','Quotation ID','number'],['amount','Amount','number',true],['currency','Currency','select:INR,USD,EUR,GBP'],['dueDate','Due date','date'],['status','Status','select:draft,issued,void']],
 website:[['pageKey','Page key','text',true],['sectionKey','Section key','text',true],['content','Content (JSON object)','textarea',true]]
 };
 const data=await api('/api/admin/erp/'+resource),items=data.items;
 const controls=fields[resource].map(([key,label,type,required])=>'<label for="erp_'+key+'">'+esc(label)+'</label>'+(type==='textarea'?'<textarea id="erp_'+key+'" name="'+key+'" '+(required?'required':'')+'>{}</textarea>':type.startsWith('select:')?'<select id="erp_'+key+'" name="'+key+'">'+type.slice(7).split(',').map(v=>'<option value="'+v+'">'+esc(v)+'</option>').join('')+'</select>':'<input id="erp_'+key+'" name="'+key+'" type="'+type+'" '+(required?'required':'')+(type==='number'?' min="0" step="any"':'')+'>')).join('');
 const columns=resource==='website'?['page_key','section_key','content','updated_at']:resource==='tasks'?['id','project_id','title','status','assignee']:resource==='projects'?['id','name','status','due_date','client_id']:resource==='quotations'?['id','title','amount','currency','status']:['id','client_id','amount','paid_amount','status'];
 $('content').innerHTML='<div class="panel"><h2>Create '+esc(resource.slice(0,-1))+'</h2><form id="erpForm" class="form">'+controls+'<button class="btn" style="margin-top:14px">Save</button></form></div><div class="panel"><h2>Recent records ('+items.length+')</h2>'+(items.length?'<table><thead><tr>'+columns.map(k=>'<th>'+esc(k.replaceAll('_',' '))+'</th>').join('')+'</tr></thead><tbody>'+items.map(x=>'<tr>'+columns.map(k=>'<td>'+esc(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<div class="empty">No records yet.</div>')+'</div>';
 if(resource==='invoices'&&items.length){$('content').insertAdjacentHTML('beforeend','<div class="panel"><h2>Record verified manual payment</h2><form id="paymentForm" class="form"><label>Invoice</label><select name="invoiceId" required>'+items.filter(i=>['issued','part_paid'].includes(i.status)).map(i=>'<option value="'+esc(i.id)+'">#'+esc(i.id)+' — '+esc(i.currency)+' '+esc(i.amount)+' (paid '+esc(i.paid_amount)+')</option>').join('')+'</select><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Payment reference</label><input name="reference" minlength="3" maxlength="120" required><label>Notes</label><input name="note" maxlength="1000"><button class="btn">Record payment</button></form><p class="muted">Only record a payment after independently verifying the transaction.</p></div>');$('paymentForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('/api/admin/erp/invoices/'+encodeURIComponent(f.invoiceId)+'/payments',{method:'POST',body:JSON.stringify({amount:Number(f.amount),reference:f.reference,note:f.note})});await renderErp('invoices');alertBox('Verified payment recorded.')}catch(err){alertBox(err.message,true)}}}
 $('erpForm').onsubmit=async e=>{e.preventDefault();const raw=Object.fromEntries(new FormData(e.target));const body={};for(const [key,value] of Object.entries(raw)){if(value==='')continue;if(key==='content'){try{body[key]=JSON.parse(value)}catch{alertBox('Content must be valid JSON.',true);return}}else if(['amount','paidAmount','projectId','quotationId'].includes(key))body[key]=Number(value);else body[key]=value}try{await api(resource==='website'?'/api/admin/erp/website/section':'/api/admin/erp/'+resource,{method:resource==='website'?'PUT':'POST',body:JSON.stringify(body)});await renderErp(resource);alertBox('Record created successfully.')}catch(err){alertBox(err.message,true)}};
}
async function renderHr(){
 const [overview,people,att,leaves]=await Promise.all([api('/api/admin/hr/overview'),api('/api/admin/hr/employees'),api('/api/admin/hr/attendance'),api('/api/admin/hr/leaves')]);
 const options=people.employees.filter(p=>p.is_active).map(p=>'<option value="'+esc(p.user_id)+'">'+esc(p.full_name)+'</option>').join('');const ownOptions=accountType==='owner'?options:people.employees.filter(p=>p.user_id===me.id||p.user_id===me.userId).map(p=>'<option value="'+esc(p.user_id)+'">'+esc(p.full_name)+'</option>').join('');
 const table=(rows,heads,render)=>rows.length?'<table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(render).join('')+'</tbody></table>':'<div class="empty">No records yet.</div>';
 const o=overview.overview;
 $('content').innerHTML='<div class="grid"><div class="card"><div class="muted">Active employees</div><div class="number">'+o.active_employees+'</div></div><div class="card"><div class="muted">Present today</div><div class="number">'+o.present_today+'</div></div><div class="card"><div class="muted">Pending leave requests</div><div class="number">'+o.pending_leaves+'</div></div></div>'+
 '<div class="panel"><h2>Employee records</h2>'+table(people.employees,['Employee','Role','Department','Job title','Update'],p=>'<tr><td>'+esc(p.full_name)+'</td><td>'+esc(p.role)+'</td><td>'+esc(p.department||'—')+'</td><td>'+esc(p.job_title||'—')+'</td><td><button class="btn alt" data-edit="'+esc(p.user_id)+'">Edit</button></td></tr>')+'</div>'+
 '<div class="panel"><h2>Mark attendance</h2><form id="attendanceForm" class="form"><label>Employee</label><select name="staffUserId" required>'+options+'</select><label>Date</label><input type="date" name="attendanceDate" required><label>Status</label><select name="status"><option value="present">Present</option><option value="absent">Absent</option><option value="half_day">Half day</option><option value="on_leave">On leave</option></select><label>Notes</label><input name="notes" maxlength="500"><button class="btn" style="margin-top:12px">Save attendance</button></form>'+table(att.attendance,['Date','Employee','Status'],a=>'<tr><td>'+esc(a.attendance_date)+'</td><td>'+esc(a.full_name)+'</td><td>'+esc(a.status)+'</td></tr>')+'</div>'+
 '<div class="panel"><h2>Leave requests</h2><form id="leaveForm" class="form"><label>Employee</label><select name="staffUserId" required>'+ownOptions+'</select><label>Start date</label><input name="startDate" type="date" required><label>End date</label><input name="endDate" type="date" required><label>Reason</label><textarea name="reason" required maxlength="1000"></textarea><button class="btn" style="margin-top:12px">Request leave</button></form>'+table(leaves.leaves,['Employee','Dates','Reason','Status','Decision'],l=>'<tr><td>'+esc(l.full_name)+'</td><td>'+esc(l.start_date)+' – '+esc(l.end_date)+'</td><td>'+esc(l.reason)+'</td><td>'+esc(l.status)+'</td><td>'+(l.status==='pending'?(accountType==='owner'||me.permissions?.includes('hr:leave:approve')?'<button class="btn alt" data-leave="'+l.id+'" data-decision="approved">Approve</button> <button class="btn alt" data-leave="'+l.id+'" data-decision="rejected">Reject</button>':'—'):'—')+'</td></tr>')+'</div>';
 const submit=(id,url)=>{$(id).onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api(url,{method:'POST',body:JSON.stringify(d)});await renderHr();alertBox('Saved successfully.')}catch(err){alertBox(err.message,true)}}};
 submit('attendanceForm','/api/admin/hr/attendance');submit('leaveForm','/api/admin/hr/leaves');
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const p=people.employees.find(x=>x.user_id===b.dataset.edit);const department=prompt('Department',p.department||'');if(department===null)return;const jobTitle=prompt('Job title',p.job_title||'');if(jobTitle===null)return;try{await api('/api/admin/hr/employees/'+p.user_id,{method:'PATCH',body:JSON.stringify({department,jobTitle,joiningDate:p.joining_date?String(p.joining_date).slice(0,10):null,notes:p.notes||''})});await renderHr();alertBox('Employee profile updated.')}catch(err){alertBox(err.message,true)}});
 document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{if(!confirm('Confirm leave decision?'))return;try{await api('/api/admin/hr/leaves/'+b.dataset.leave+'/decision',{method:'PATCH',body:JSON.stringify({status:b.dataset.decision})});await renderHr();alertBox('Leave decision saved.')}catch(err){alertBox(err.message,true)}});
}
function renderEmployee(){const must=me.mustChangePassword;$('content').innerHTML='<div class="panel"><h2>'+esc(me.fullName)+'</h2><p>Role: '+esc(me.role)+'</p><p>'+ (must?'You must change your temporary password before using any CRM modules.':'Your account is active. Only permitted modules are available.')+'</p></div>'+(must?'<div class="panel"><h2>Set your password</h2><form id="changePassword" class="form"><label for="newPassword">New password (12+ characters)</label><input type="password" id="newPassword" minlength="12" autocomplete="new-password" required><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" minlength="12" autocomplete="new-password" required><button class="btn" style="margin-top:15px">Update password</button></form></div>':'');if(must){$('changePassword').onsubmit=async e=>{e.preventDefault();if($('newPassword').value!==$('confirmPassword').value){alertBox('Passwords do not match.',true);return}const button=e.target.querySelector('button');button.disabled=true;try{await api('/api/admin/staff/change-password',{method:'POST',body:JSON.stringify({newPassword:$('newPassword').value})});signOut();$('loginMode').value='employee';$('loginError').textContent='Password updated. Sign in with your new password.'}catch(err){alertBox(err.message,true)}finally{button.disabled=false}}}}
function renderEmployeeLeads(){$('content').innerHTML='<div class="panel"><h2>Assigned access: Leads (read-only)</h2>'+leadTable(leads,false)+'</div>'}
function renderDashboard(errors){const count=status=>leads.filter(l=>l.status===status).length;$('content').innerHTML='<div class="grid"><div class="card"><div class="muted">Total leads (latest 50)</div><div class="number">'+leads.length+'</div></div><div class="card"><div class="muted">Won leads</div><div class="number">'+count('won')+'</div></div><div class="card"><div class="muted">Clients</div><div class="number">'+clients.length+'</div></div></div><div class="panel"><h2>Module availability</h2>'+['Leads','Clients','Team'].map((n,i)=>'<p><b>'+n+':</b> '+(errors[i]?'<span class="muted">'+esc(errors[i])+'</span>':'Connected')+'</p>').join('')+'</div><div class="panel"><h2>Recent leads</h2>'+leadTable(leads.slice(0,8),false)+'</div>'}
function leadTable(items,editable){if(!items.length)return '<div class="empty">No leads found.</div>';return '<table><thead><tr><th>Name</th><th>Email</th><th>Service</th><th>Status</th><th>Created</th>'+(editable?'<th>Actions</th>':'')+'</tr></thead><tbody>'+items.map(l=>'<tr><td>'+esc(l.name)+'</td><td>'+esc(l.email)+'</td><td>'+esc(l.service)+'</td><td><span class="pill">'+esc(l.status)+'</span></td><td>'+esc((l.created_at||'').slice(0,10))+'</td>'+(editable?'<td><div class="actions"><button class="btn alt" data-status="'+esc(l.id)+'">Update</button><button class="btn alt" data-activity="'+esc(l.id)+'">History</button><button class="btn" data-convert="'+esc(l.id)+'">Convert</button></div></td>':'')+'</tr>').join('')+'</tbody></table>'}
function renderLeads(){const statuses=['new','contacted','qualified','proposal','won','lost'];$('content').innerHTML='<div class="panel"><div class="toolbar"><h2>Leads ('+leads.length+')</h2><input id="search" placeholder="Search name, email or service" aria-label="Search leads"></div><div id="leadTable">'+leadTable(leads,true)+'</div></div><div id="leadDetail"></div>';$('search').oninput=()=>{$('leadTable').innerHTML=leadTable(leads.filter(l=>[l.name,l.email,l.service].some(v=>String(v||'').toLowerCase().includes($('search').value.toLowerCase()))),true)};$('content').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.status||b.dataset.activity||b.dataset.convert;if(!id)return;try{if(b.dataset.status){const lead=leads.find(l=>l.id===id);const status=prompt('New status ('+statuses.join(', ')+')',lead.status);if(status===null)return;if(!statuses.includes(status))throw Error('Choose a valid status.');const note=prompt('Follow-up note (optional)')||undefined;await api('/api/admin/lead-workflow/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status,note})});await navigate('leads');alertBox('Lead updated.')}else if(b.dataset.activity){const data=await api('/api/admin/lead-workflow/'+encodeURIComponent(id)+'/activity');$('leadDetail').innerHTML='<div class="panel"><h2>Activity history</h2>'+(data.activity.length?data.activity.map(a=>'<p><b>'+esc(a.from_status)+' → '+esc(a.to_status)+'</b> · '+esc((a.created_at||'').slice(0,16))+'<br>'+esc(a.note||'')+'</p>').join(''):'No activity yet')+'</div>'}else if(b.dataset.convert){if(!confirm('Convert this won lead into a client?'))return;await api('/api/admin/clients/from-lead/'+encodeURIComponent(id),{method:'POST',body:'{}'});alertBox('Client created successfully.')}}catch(err){alertBox(err.message,true)}}}
function renderClients(){$('content').innerHTML='<div class="panel"><h2>Client Portal Access</h2><p>Link an existing Supabase Auth user ID to a client. Only link accounts after verifying the client's identity.</p><form id="portalLinkForm" class="form"><label>Client</label><select name="clientId" required>'+clients.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select><label>Authenticated user UUID</label><input name="userId" required placeholder="User UUID"><button class="btn">Grant access</button></form><button id="portalAccessRefresh" class="btn alt">View linked accounts</button><div id="portalLinks"></div><p><a href="/client-portal" target="_blank" rel="noopener">Open Client Portal</a></p></div><div class="panel"><h2>Clients ('+clients.length+')</h2>'+(clients.length?'<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Created</th></tr></thead><tbody>'+clients.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.phone)+'</td><td>'+esc((c.created_at||'').slice(0,10))+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No clients yet. Convert a won lead to add a client.</div>')+'</div>';const form=$('portalLinkForm');form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));try{await api('/api/admin/clients/portal-access',{method:'POST',body:JSON.stringify(data)});alertBox('Client access linked.');await refreshPortalLinks()}catch(err){alertBox(err.message,true)}};$('portalAccessRefresh').onclick=refreshPortalLinks;async function refreshPortalLinks(){try{const data=await api('/api/admin/clients/portal-access');$('portalLinks').innerHTML=data.access.length?'<table><thead><tr><th>Client</th><th>User ID</th><th>Action</th></tr></thead><tbody>'+data.access.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.user_id)+'</td><td><button class="btn alt" data-client-id="'+esc(x.client_id)+'" data-user-id="'+esc(x.user_id)+'">Revoke</button></td></tr>').join('')+'</tbody></table>':'No client accounts linked.';$('portalLinks').onclick=async e=>{const b=e.target.closest('button[data-user-id]');if(!b||!confirm('Revoke this client account access?'))return;try{await api('/api/admin/clients/portal-access/revoke',{method:'POST',body:JSON.stringify({clientId:b.dataset.clientId,userId:b.dataset.userId})});await refreshPortalLinks()}catch(err){alertBox(err.message,true)}}}catch(err){alertBox(err.message,true)}}}
function renderStaff(){$('content').innerHTML='<div class="panel"><h2>Add employee</h2><form id="staffForm" class="form"><label for="staffName">Full name</label><input id="staffName" required minlength="2"><label for="staffEmail">Email</label><input id="staffEmail" type="email" required><label for="staffRole">Role</label><select id="staffRole"><option value="sales">Sales</option><option value="hr">HR (Human Resources)</option><option value="developer">Developer</option><option value="manager">Manager</option><option value="accountant">Accountant</option><option value="super_admin">Super Admin</option></select><button class="btn" style="margin-top:15px">Create employee</button></form><div id="credential"></div></div><div class="panel"><h2>Employees ('+staff.length+')</h2>'+(staff.length?'<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead><tbody>'+staff.map(s=>'<tr><td>'+esc(s.full_name)+'</td><td>'+esc(s.email)+'</td><td>'+esc(s.role)+'</td><td>'+esc(s.is_active?'Yes':'No')+'</td><td><div class="actions">'+(s.is_active?'<button class="btn alt" data-reset="'+esc(s.user_id)+'">Reset password</button><button class="btn danger" data-deactivate="'+esc(s.user_id)+'">Deactivate</button>':'Inactive')+'</div></td></tr>').join('')+'</tbody></table>':'<div class="empty">No employees found.</div>')+'</div>';$('staffForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const data=await api('/api/admin/staff/',{method:'POST',body:JSON.stringify({fullName:$('staffName').value,email:$('staffEmail').value,role:$('staffRole').value})});$('credential').innerHTML='<div class="notice">Employee created. Temporary password (copy now): <code id="tempPassword"></code></div>';$('tempPassword').textContent=data.temporaryPassword;staff=(await api('/api/admin/staff/')).staff;alertBox('Employee created. Copy the one-time password before leaving this page.')}catch(err){alertBox(err.message,true)}finally{b.disabled=false}};$('content').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.reset||b.dataset.deactivate;if(!id)return;try{if(b.dataset.reset){if(!confirm('Reset this employee password and revoke sessions?'))return;const data=await api('/api/admin/staff/'+encodeURIComponent(id)+'/reset-password',{method:'POST',body:'{}'});$('credential').innerHTML='<div class="notice">New temporary password (copy now): <code id="tempPassword"></code></div>';$('tempPassword').textContent=data.temporaryPassword}else{if(!confirm('Deactivate this employee immediately?'))return;await api('/api/admin/staff/'+encodeURIComponent(id)+'/deactivate',{method:'POST',body:'{}'});await navigate('staff');alertBox('Employee deactivated.')}}catch(err){alertBox(err.message,true)}}}
})();
</script></body></html>
