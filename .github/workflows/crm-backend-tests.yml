name: CRM backend tests

on:
  push:
    branches:
      - development/admin-crm-foundation
    paths:
      - 'backend/**'
      - 'assets/js/admin.js'
      - '.github/workflows/crm-backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'assets/js/admin.js'
      - '.github/workflows/crm-backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Check Owner dashboard JavaScript syntax
        run: node --check ../assets/js/admin.js
