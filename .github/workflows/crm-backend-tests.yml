name: CRM backend tests

on:
  push:
    branches:
      - development/admin-crm-foundation
      - development/erp-payment-workflows
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - 'assets/js/admin.js'
      - '.github/workflows/crm-backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - 'assets/js/admin.js'
      - '.github/workflows/crm-backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Complete CRM regression checks
        run: |
          npm test
          node scripts/release-check.js
          find src scripts test test-support -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ../assets/js/admin.js
